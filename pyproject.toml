[project]
name = "gondola-vision"
version = "0.1.0"
description = "Reconhecimento de produtos em gondola por identificacao por similaridade, construido parte a parte com avaliacao medida."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Cada grupo entra quando a parte correspondente for construida.
deteccao = ["ultralytics>=8.2", "opencv-python-headless>=4.10"]
encoder = ["torch>=2.3", "open-clip-torch>=2.24", "timm>=1.0"]
indice = ["faiss-cpu>=1.8"]
treino = ["pytorch-metric-learning>=2.5"]
ocr = ["rapidocr-onnxruntime>=1.3"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
gondola = "gondola.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gondola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Opcional (grupo deteccao): o mypy precisa passar tambem sem ele instalado.
module = ["ultralytics", "ultralytics.*"]
ignore_missing_imports = true
